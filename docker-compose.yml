services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LIMITER_STRATEGY: ${LIMITER_STRATEGY:-fixed_window}
      RATE_LIMIT: ${RATE_LIMIT:-10}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
      TOKEN_BUCKET_CAPACITY: ${TOKEN_BUCKET_CAPACITY:-10}
      TOKEN_BUCKET_REFILL_RATE: ${TOKEN_BUCKET_REFILL_RATE:-1.0}
      FAIL_MODE: ${FAIL_MODE:-closed}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in your environment or .env file}
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
